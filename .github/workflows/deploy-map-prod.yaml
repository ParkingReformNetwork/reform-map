name: Deploy map to prod
on: [workflow_dispatch]
jobs:
  deploy_prod:
    if: github.repository_owner == 'ParkingReformNetwork'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Copy from staging to production
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRN_FTP_HOST }}
          username: ${{ secrets.PRN_SERVER_USERNAME }}
          key: ${{ secrets.PRN_SERVER_PRIVATE_KEY }}
          script: |
            # We do not use `--delete` to avoid deleting subfolders.
            rsync --archive --verbose --no-times \
              /var/www/${{ secrets.PRN_SERVER_HOST }}/mandates-map-staging/ \
              /var/www/${{ secrets.PRN_SERVER_HOST }}/mandates-map/

      - name: Notify Slack on success
        uses: ./.github/actions/slack-post
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_STATUS_THREAD_TS: ${{ vars.SLACK_STATUS_THREAD_TS }}
        with:
          text: ":rocket: The live reform map was updated by ${{ github.actor }}."
          broadcast: "true"
          status: "live map updated by ${{ github.actor }}"

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/slack-post
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_STATUS_THREAD_TS: ${{ vars.SLACK_STATUS_THREAD_TS }}
        with:
          text: ":x: *Deploy map to prod* failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          broadcast: "true"
          status: "FAILED: Deploy map to prod, ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
