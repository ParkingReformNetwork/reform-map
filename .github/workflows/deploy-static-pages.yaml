name: Deploy static pages to prod
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy-prod:
    if: github.repository_owner == 'ParkingReformNetwork'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: npm ci

      - run: npm run gen-data-set
      - name: Copy data set zip to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PRN_FTP_HOST }}
          username: ${{ secrets.PRN_SERVER_USERNAME }}
          key: ${{ secrets.PRN_SERVER_PRIVATE_KEY }}
          source: data/generated/mandates-map-data.zip
          target: /var/www/${{ secrets.PRN_SERVER_HOST }}/mandates-map/data
          strip_components: 2

      - run: npm run gen-html
      - run: npm run gen-redirects
      - name: Archive city_detail/ contents
        run: |
          cd city_detail
          tar -czf ../city_details.tar.gz .
      - name: Copy city_detail/ to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PRN_FTP_HOST }}
          username: ${{ secrets.PRN_SERVER_USERNAME }}
          key: ${{ secrets.PRN_SERVER_PRIVATE_KEY }}
          source: city_details.tar.gz
          target: /var/www/${{ secrets.PRN_SERVER_HOST }}/mandates-map/city_detail
      - name: Extract city_detail/ on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRN_FTP_HOST }}
          username: ${{ secrets.PRN_SERVER_USERNAME }}
          key: ${{ secrets.PRN_SERVER_PRIVATE_KEY }}
          script: |
            mkdir -p /var/www/${{ secrets.PRN_SERVER_HOST }}/mandates-map/details-tmp
            tar -xzf \
              /var/www/${{ secrets.PRN_SERVER_HOST }}/mandates-map/city_detail/city_details.tar.gz \
              -C /var/www/${{ secrets.PRN_SERVER_HOST }}/mandates-map/details-tmp

            rsync --archive --verbose --delete --no-times \
              /var/www/${{ secrets.PRN_SERVER_HOST }}/mandates-map/details-tmp/ \
              /var/www/${{ secrets.PRN_SERVER_HOST }}/mandates-map/city_detail/

            rm -rf /var/www/${{ secrets.PRN_SERVER_HOST }}/mandates-map/details-tmp

      - name: Notify Slack that new data needs a prod deploy
        if: startsWith(github.event.head_commit.message, 'Update data')
        uses: ./.github/actions/slack-post
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_STATUS_THREAD_TS: ${{ vars.SLACK_STATUS_THREAD_TS }}
        with:
          text: ":construction: New reform map data is on staging and the city detail pages are live. Run *Deploy map to prod* to update the live map: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-map-prod.yaml"
          status: "new data on staging, waiting for a prod deploy"

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/slack-post
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_STATUS_THREAD_TS: ${{ vars.SLACK_STATUS_THREAD_TS }}
        with:
          text: ":x: *Deploy static pages to prod* failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          broadcast: "true"
          status: "FAILED: Deploy static pages to prod, ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
